<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Properties & Plots| Yelagiri Properties</title>
    <style>
        /* ==================================================
            ROOT VARIABLES & RESET
        ================================================== */
        :root {
            --primary: #2e7d32;
            --primary-dark: #1b3e5e;
            --accent: #ffa000;
            --text-dark: #222;
            --text-muted: #666;
            --white: #ffffff;
            --bg-light: #f7f7f7;
            --border-light: #eeeeee;
            --radius-sm: 6px;
            --radius-lg: 5px;
            --shadow-sm: 0 4px 10px rgba(0, 0, 0, 0.08);
            --shadow-md: 0 10px 30px rgba(0, 0, 0, 0.15);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --max-width: 1200px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--text-dark);
            background: var(--bg-light);
            line-height: 1.5;
            overflow-x: hidden;
        }

        
        .container {
            width: 100%;
            max-width: var(--max-width);
            margin: 40px auto;
            padding: 0 20px;
        }
        .back-btn {
            background: var(--white);
            border: 1px solid var(--border-light);
            color: var(--primary);
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: var(--transition);
            padding: 10px 20px;
            border-radius: 100px;
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 20px 0;
            box-shadow: var(--shadow-sm);
            margin-top: 9%;
        }

        .back-btn:hover {
            background: var(--primary);
            color: var(--white);
        }

        /* ==================================================
            SECTION HEADINGS
        ================================================== */
        .section-heading {
            margin: 40px 0px 20px;
            font-size: 28px;
            font-weight: 800;
            color: var(--primary-dark);
            border-left: 5px solid var(--primary);
            padding-left: 15px;
        }

        /* ==================================================
            FILTER BAR
        ================================================== */
        .filter-bar {
            background: var(--white);
            padding: 24px;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-light);
            box-shadow: var(--shadow-sm);
            margin: 30px 0;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
        }
       


        .filter-group { display: flex; flex-direction: column; gap: 8px; }
        .filter-label { font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
        .filter-select {
            width: 100%;
            padding: 14px;
            background: var(--bg-light);
            border: 1px solid #e0e0e0;
            border-radius: var(--radius-sm);
            outline: none;
            font-size: 16px;
        }

        /* ==================================================
            PROPERTY GRID & CARDS
        ================================================== */
        .property-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px;
            margin-bottom: 40px;
        }

        .property-card {
            background: var(--white);
            border-radius: var(--radius-lg);
            overflow: hidden;
            border: 1px solid var(--border-light);
            box-shadow: var(--shadow-sm);
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .property-card:hover { transform: translateY(-8px); box-shadow: var(--shadow-md); }

        .card-image-wrapper { aspect-ratio: 16 / 10; overflow: hidden; position: relative; }
        .card-image-wrapper img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.6s ease; }
        .property-card:hover .card-image-wrapper img { transform: scale(1.1); }

        .type-tag { position: absolute; top: 15px; left: 15px; background: var(--accent); color: var(--white); padding: 5px 14px; font-size: 11px; font-weight: 700; border-radius: 100px; text-transform: uppercase; z-index: 2; }
        .card-body { padding: 20px; flex-grow: 1; }
        .card-title { font-size: 20px; font-weight: 700; color: var(--primary-dark); margin-bottom: 6px; }
        .card-location { color: var(--text-muted); font-size: 14px; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
        .card-desc { color: var(--text-muted); font-size: 14px; margin-bottom: 15px; line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

        .card-footer { border-top: 1px solid var(--border-light); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; background: #fafafa; }
        .card-size { font-size: 13px; font-weight: 700; color: var(--primary-dark); }
        .card-link { color: var(--primary); font-weight: 700; font-size: 13px; }

        /* ==================================================
            DETAIL VIEW LAYOUT (UPDATED)
        ================================================== */
        .detail-header-grid { 
            display: grid; 
            grid-template-columns: 1fr 380px; 
            gap: 30px; 
            margin-bottom: 30px;
        }

        .gallery-main-frame { 
            aspect-ratio: 16 / 9; 
            width: 100%; 
            margin-bottom: 15px; 
            border-radius: var(--radius-lg); 
            overflow: hidden; 
            box-shadow: var(--shadow-sm); 
            background: #eee; 
        }
        .gallery-main-frame img { width: 100%; height: 100%; object-fit: cover; transition: opacity 0.3s; }
        
        .gallery-thumbs-row { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 10px; }
        .gallery-thumb-item { flex: 0 0 100px; aspect-ratio: 3/2; border-radius: var(--radius-sm); cursor: pointer; opacity: 0.6; border: 2px solid transparent; overflow: hidden; transition: 0.3s; }
        .gallery-thumb-item.active { opacity: 1; border-color: var(--primary); }
        .gallery-thumb-item img { width: 100%; height: 100%; object-fit: cover; }

        .content-box { 
            background: var(--white); 
            padding: 30px; 
            border-radius: var(--radius-lg); 
            border: 1px solid var(--border-light); 
            box-shadow: var(--shadow-sm); 
            margin-bottom: 30px; 
        }

        .detail-title { font-size: 32px; font-weight: 800; color: var(--primary-dark); margin-bottom: 10px; }
        
        .stats-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); 
            gap: 20px; 
            margin: 25px 0; 
            padding: 20px 0; 
            border-top: 1px solid #eee; 
            border-bottom: 1px solid #eee; 
        }
        .stat-item label { font-size: 11px; text-transform: uppercase; font-weight: 700; color: var(--text-muted); display: block; }
        .stat-item p { font-weight: 700; font-size: 16px; color: var(--primary-dark); }

        .amenity-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; margin-top: 15px; }
        .amenity-item { display: flex; align-items: center; gap: 8px; font-size: 15px; background: #f0fdf4; padding: 10px 15px; border-radius: 6px; color: #15803d; font-weight: 600; }

        /* Sidebar Form */
        .sidebar { height: fit-content; }
        .form-title { font-size: 20px; font-weight: 700; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 5px; }
        .form-input, .form-textarea { width: 100%; padding: 12px; border: 1px solid #e0e0e0; border-radius: 5px; font-family: inherit; font-size: 14px; }
        .submit-btn { width: 100%; background: var(--primary); color: white; padding: 15px; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; transition: 0.3s; }
        .submit-btn:hover { background: var(--primary-dark); }

        .hidden { display: none !important; }
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 1024px) {
            .detail-header-grid { grid-template-columns: 1fr; }
        }
        .properties-margin {
            margin-top: 10%!important;
            
        }
          /* ==================================================
            RESPONSIVE MEDIA QUERIES
        ================================================== */
        @media (max-width: 1024px) {
            .detail-header-grid { 
                grid-template-columns: 1fr; 
                gap: 20px; 
            }
        }

        @media (max-width: 768px) {
            .properties-margin { 
                margin-top: 14% !important; 
            }
            .property-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            .section-heading {
                font-size: 22px;
            }
        }

        @media (max-width: 640px) {
            .filter-bar {
                grid-template-columns: 1fr;
                padding: 10px;
            }
            .content-box { 
                padding: 20px; 
            }
            .detail-title { 
                font-size: 24px; 
            }
            .stats-grid { 
                grid-template-columns: repeat(2, 1fr); 
            }
            .amenity-grid {
                grid-template-columns: 1fr;
            }
            .back-btn{
                margin-top: 14vh;
            }
                    .properties-margin {
            margin-top: 14vh!important;
            
        }
    }
    </style>
</head>

<body>
   <!-- LOAD HEADER -->
<div id="header"></div>

    <main class="container">
        <!-- BACK BUTTON (Shared) -->
        <div id="navBack" class="hidden">
            <button onclick="showListing()" class="back-btn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
                Back to Listings
            </button>
        </div>

        <!-- LISTING PAGE -->
        <div id="listingPage" class="fade-in properties-margin">
            <div class="filter-bar">
                <div class="filter-group">
                    <label class="filter-label">Location</label>
                    <select id="locationFilter" onchange="applyFilters()" class="filter-select">
                        <option value="all">All Locations</option>
                        <option value="Yelagiri">Yelagiri</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label class="filter-label">Property Type</label>
                    <select id="typeFilter" onchange="applyFilters()" class="filter-select">
                        <option value="all">All Types</option>
                        <option value="Plot">Plot</option>
                        <option value="Villa">Villas</option>
                        <option value="Home Stay">Home Stay</option>
                    </select>
                </div>
            </div>

            <!-- Plots Section -->
            <div id="plotSection">
                <h2 class="section-heading">All Plots</h2>
                <div id="plotGrid" class="property-grid"></div>
            </div>

            <!-- Villas Section -->
            <div id="villaSection">
                <h2 class="section-heading">All Villas</h2>
                <div id="villaGrid" class="property-grid"></div>
            </div>

            <!-- Home Stays Section -->
            <div id="homestaySection">
                <h2 class="section-heading">All Home Stays</h2>
                <div id="homestayGrid" class="property-grid"></div>
            </div>
        </div>

        <!-- DETAIL PAGE -->
        <div id="detailPage" class="hidden fade-in">
            <div id="detailContent">
                <!-- Injected via JS -->
            </div>
        </div>
    </main>

    <script>
        const data = {
            "properties": [
                {
                    "id": 1,
                    "name": "Athanavoor Heights",
                    "type": "Villa",
                    "location": "Yelagiri",
                    "facing": "North",
                    "size": "2500 sqft",
                    "description": "Luxurious villa located in the heart of Athanavoor. Features include modern architecture, spacious interiors, and a private garden area perfect for family retreats. This property has been designed by award winning architects to maximize natural light and airflow.",
                    "images": [
                        "https://images.unsplash.com/photo-1613490493576-7fde63acd811?auto=format&fit=crop&w=800",
                        "https://images.unsplash.com/photo-1613977257363-707ba9348227?auto=format&fit=crop&w=800",
                        "https://images.unsplash.com/photo-1512917774080-9991f1c4c750?auto=format&fit=crop&w=800"
                    ],
                    "amenities": ["Gated Community", "Security", "Clubhouse", "Park", "Water Storage", "Swimming Pool", "Jogging Track"]
                },
                {
                    "id": 2,
                    "name": "Nilavoor Greens",
                    "type": "Plot",
                    "location": "Yelagiri",
                    "facing": "East",
                    "size": "1200 sqft",
                    "description": "Premium residential plots available in Nilavoor. This ready-to-construct land offers excellent soil quality and clear titles, situated near the scenic lake. Ideal for those looking to build their custom dream home in a peaceful neighborhood.",
                    "images": [
                        "https://images.unsplash.com/photo-1500382017468-9049fed747ef?auto=format&fit=crop&w=800",
                        "https://images.unsplash.com/photo-1592595825315-724f113f3640?auto=format&fit=crop&w=800"
                    ],
                    "amenities": ["Clear Title", "Fenced", "Blacktop Road", "Street Lights", "Drainage System"]
                },
                {
                    "id": 3,
                    "name": "Skyview Residency",
                    "type": "Home Stay",
                    "location": "Yelagiri",
                    "facing": "West",
                    "size": "1100 sqft",
                    "description": "A modern 2BHK home stay offering panoramic views of the Yelagiri hills. Designed for comfort with high-quality flooring and ventilated rooms. The complex includes modern safety features and luxury finishes throughout.",
                    "images": [
                        "https://images.unsplash.com/photo-1545324418-cc1a3fa10c00?auto=format&fit=crop&w=800",
                        "https://images.unsplash.com/photo-1502672260266-1c1ef2d93688?auto=format&fit=crop&w=800"
                    ],
                    "amenities": ["Lift", "CCTV", "Power Backup", "Gym", "Covered Parking", "Intercom Facility"]
                },
                {
                    "id": 4,
                    "name": "Mangalam Retreat",
                    "type": "Villa",
                    "location": "Yelagiri",
                    "facing": "North",
                    "size": "2800 sqft",
                    "description": "An exquisite vacation villa in Mangalam. Surrounded by lush greenery, this property is perfect for those seeking peace and luxury away from the city. Features high ceilings and a custom wood-finished interior.",
                    "images": [
                        "https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=800",
                        "https://images.unsplash.com/photo-1600566752355-35792bedcfea?auto=format&fit=crop&w=800"
                    ],
                    "amenities": ["Private Pool", "Landscaped Garden", "Servant Room", "Solar Power", "Rain Water Harvesting"]
                }
            ]
        };

        function showListing() {
            document.getElementById('listingPage').classList.remove('hidden');
            document.getElementById('detailPage').classList.add('hidden');
            document.getElementById('navBack').classList.add('hidden');
            window.scrollTo(0, 0);
            applyFilters();
        }

        function showDetail(id) {
            const p = data.properties.find(prop => prop.id === id);
            if (!p) return;

            document.getElementById('listingPage').classList.add('hidden');
            document.getElementById('detailPage').classList.remove('hidden');
            document.getElementById('navBack').classList.remove('hidden');
            window.scrollTo(0, 0);

            const detailContent = document.getElementById('detailContent');
            detailContent.innerHTML = `
                <div class="detail-header-grid">
                    <div class="gallery-column">
                        <div class="gallery-main-frame">
                            <img id="mainDisplayImg" src="${p.images[0]}" alt="${p.name}">
                        </div>
                        <div class="gallery-thumbs-row">
                            ${p.images.map((img, idx) => `
                                <div class="gallery-thumb-item ${idx === 0 ? 'active' : ''}" onclick="updateGallery(this, '${img}')">
                                    <img src="${img}" alt="Thumbnail">
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <div class="sidebar">
                        <div class="content-box" style="border-top: 4px solid var(--primary); margin-bottom: 0;">
                            <h3 class="form-title">Enquire Now</h3>
                            <form onsubmit="event.preventDefault(); document.getElementById('successMsg').classList.remove('hidden'); this.style.opacity='0.5';">
                                <div class="form-group">
                                    <label>Name</label>
                                    <input type="text" placeholder="Full Name" required class="form-input">
                                </div>
                                <div class="form-group">
                                    <label>Phone</label>
                                    <input type="tel" placeholder="Mobile Number" required class="form-input">
                                </div>
                                <div class="form-group">
                                    <label>Message</label>
                                    <textarea rows="3" class="form-textarea" placeholder="I'm interested in ${p.name}..."></textarea>
                                </div>
                                <button type="submit" class="submit-btn">Send Interest</button>
                                <div id="successMsg" class="hidden" style="margin-top:15px; color: var(--primary); font-weight:700; text-align:center;">
                                    ✓ Inquiry sent successfully!
                                </div>
                            </form>
                        </div>
                    </div>
                </div>

                <div class="content-box">
                    <h1 class="detail-title">${p.name}</h1>
                    <p class="card-location" style="font-size: 16px;">📍 ${p.location} • <span style="color: var(--primary); font-weight: 700;">${p.type}</span></p>

                    <div class="stats-grid">
                        <div class="stat-item">
                            <label>Total Area</label>
                            <p>${p.size}</p>
                        </div>
                        <div class="stat-item">
                            <label>Facing Direction</label>
                            <p>🧭 ${p.facing}</p>
                        </div>
                        <div class="stat-item">
                            <label>Availability</label>
                            <p style="color: var(--primary)">Available Now</p>
                        </div>
                        <div class="stat-item">
                            <label>Location</label>
                            <p>${p.location}</p>
                        </div>
                    </div>

                    <div style="margin-bottom: 35px;">
                        <h3 style="margin-bottom:12px; color: var(--primary-dark);">About this Property</h3>
                        <p style="color: var(--text-muted); line-height:1.9; font-size: 16px;">${p.description}</p>
                    </div>

                    <h3 style="margin-bottom:20px; color: var(--primary-dark); border-top: 1px solid #eee; padding-top: 30px;">Key Amenities</h3>
                    <div class="amenity-grid">
                        ${p.amenities.map(a => `
                            <div class="amenity-item"><span>✓</span> ${a}</div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function updateGallery(el, src) {
            document.getElementById('mainDisplayImg').src = src;
            document.querySelectorAll('.gallery-thumb-item').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
        }

        function generateCard(p) {
            return `
                <div class="property-card fade-in" onclick="showDetail(${p.id})">
                    <div class="card-image-wrapper">
                        <img src="${p.images[0]}" alt="${p.name}" loading="lazy">
                        <div class="type-tag">${p.type}</div>
                    </div>
                    <div class="card-body">
                        <h3 class="card-title">${p.name}</h3>
                        <p class="card-location">📍 ${p.location}</p>
                        <p class="card-desc">${p.description}</p>
                    </div>
                    <div class="card-footer">
                        <span class="card-size">📐 ${p.size}</span>
                        <span class="card-link">VIEW DETAILS →</span>
                    </div>
                </div>`;
        }

        function applyFilters() {
            const loc = document.getElementById('locationFilter').value;
            const typeFilter = document.getElementById('typeFilter').value;

            const plotGrid = document.getElementById('plotGrid');
            const homestayGrid = document.getElementById('homestayGrid');
            const villaGrid = document.getElementById('villaGrid');

            plotGrid.innerHTML = homestayGrid.innerHTML = villaGrid.innerHTML = "";

            let plots = 0, homestays = 0, villas = 0;

            data.properties.forEach(p => {
                const locMatch = loc === 'all' || p.location === loc;
                const typeMatch = typeFilter === 'all' || p.type === typeFilter;

                if (locMatch && typeMatch) {
                    if (p.type === "Plot") { plots++; plotGrid.innerHTML += generateCard(p); }
                    if (p.type === "Home Stay") { homestays++; homestayGrid.innerHTML += generateCard(p); }
                    if (p.type === "Villa") { villas++; villaGrid.innerHTML += generateCard(p); }
                }
            });

            // Toggle Section Visibilities
            document.getElementById('plotSection').style.display = plots > 0 ? "block" : "none";
            document.getElementById('homestaySection').style.display = homestays > 0 ? "block" : "none";
            document.getElementById('villaSection').style.display = villas > 0 ? "block" : "none";
        }

        window.onload = applyFilters;
    </script>
    <!-- LOAD FOOTER -->
    <div id="footer"></div>

    <script>
    fetch('./partials/header.html')
        .then(res => res.text())
        .then(html => document.getElementById('header').innerHTML = html);

    fetch('./partials/footer.html')
        .then(res => res.text())
        .then(html => document.getElementById('footer').innerHTML = html);
    </script>
</body>
</html>
